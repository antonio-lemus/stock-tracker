name: Stock Tracker

on:
  schedule:
    # Runs every 10 mins (*/10) from 13:00 to 21:00 UTC (Approx 9am-5pm EST)
    # Mon-Fri (1-5)
    - cron: '*/10 13-21 * * 1-5'
  workflow_dispatch: # Allows you to manually click "Run" to test it

jobs:
  check_stocks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Libraries
        run: pip install yfinance requests

      - name: Run Tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python StockTracker.py
